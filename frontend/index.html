<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeviceOps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">DeviceOps</div>
        <div class="fleet-status">
            <span class="status-dot"></span>
            fleet online
        </div>
    </header>

    <main class="layout">
        <section class="panel panel-fleet">
            <div class="panel-header">
                <h2>Fleet</h2>
                <span class="panel-subtitle" id="fleet-count">0 devices</span>
            </div>
            <table id="device-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Profile</th>
                        <th>Status</th>
                        <th>Version</th>
                    </tr>
                </thead>
                <tbody id="device-table-body">
                    <!-- rows inserted by app.js -->
                </tbody>
            </table>
        </section>

        <aside class="panel panel-actions">
            <div class="panel-header">
                <h2>Register device</h2>
            </div>
            <form id="device-form">
                <label for="device-name">Name</label>
                <input type="text" id="device-name" placeholder="e.g. Echo Test Device" required>

                <label for="device-profile">Profile</label>
                <input type="text" id="device-profile" placeholder="e.g. echo-gen4" required>

                <label for="device-version">Current version</label>
                <input type="text" id="device-version" placeholder="optional">

                <button type="submit">Add to fleet</button>
            </form>
        </aside>

        <aside class="panel panel-actions">
            <div class="panel-header">
                <h2>Upload firmware</h2>
            </div>
            <form id="firmware-form">
                <label for="firmware-version">Version</label>
                <input type="text" id="firmware-version" placeholder="e.g. 2.1.0" required>

                <button type="submit">Upload build</button>
            </form>
            <ul id="firmware-list" class="build-list"></ul>
        </aside>

        <aside class="panel panel-actions">
            <div class="panel-header">
                <h2>Start update</h2>
            </div>
            <form id="job-form">
                <label for="job-device">Device</label>
                <select id="job-device" required></select>

                <label for="job-build">Firmware build</label>
                <select id="job-build" required></select>

                <button type="submit">Start update</button>
            </form>
            <div id="job-status"></div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
